name: Deploy to ACLClouds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: config
        env:
          PANEL_URL: ${{ secrets.PTERO_PANEL_URL }}
          API_KEY: ${{ secrets.PTERO_API_KEY }}
          SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
        run: |
          if [ -z "$PANEL_URL" ] || [ -z "$API_KEY" ] || [ -z "$SERVER_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Pterodactyl secrets are not set; skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload runtime files and restart
        if: steps.config.outputs.configured == 'true'
        uses: rexlmanu/pterodactyl-upload-action@4bae1933575fa712463da38493f5c768232d76ab # v2.5
        with:
          panel-host: ${{ secrets.PTERO_PANEL_URL }}
          api-key: ${{ secrets.PTERO_API_KEY }}
          server-id: ${{ secrets.PTERO_SERVER_ID }}
          sources: |
            ai.ts
            backups.ts
            balance.ts
            battle-state.ts
            boss.ts
            boss-mechanics.ts
            boss-rush.ts
            bot.ts
            cosmetics.ts
            emoji.ts
            errors.ts
            forsaken.ts
            i18n.ts
            loadouts.ts
            matchmaking.ts
            names.ts
            progress.ts
            pvp.ts
            skins.ts
            store.ts
            survival.ts
            synergies.ts
            tower.ts
            trials.ts
            package.json
            bun.lock
            emojis.json
            emojis-ability.json
            emojis-skins.json
          target: "./"
          restart: true

      - name: Verify deployment target
        if: steps.config.outputs.configured == 'true'
        env:
          PANEL_URL: ${{ secrets.PTERO_PANEL_URL }}
          API_KEY: ${{ secrets.PTERO_API_KEY }}
          SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
        run: |
          set -uo pipefail
          base="${PANEL_URL%/}/api/client"
          auth="Authorization: Bearer $API_KEY"

          echo "Servers visible to this API key:"
          curl -fsS -H "$auth" -H "Accept: application/json" "$base" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(s["attributes"].get("identifier"), "|", s["attributes"].get("name"), "|", s["attributes"].get("status")) for s in d.get("data", [])]' \
            || true

          sleep 10
          state=$(curl -fsS -H "$auth" -H "Accept: application/json" "$base/servers/$SERVER_ID/resources" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("attributes",{}).get("current_state"))' \
            || true)
          echo "Server state: $state"

          if [ "$state" = "offline" ]; then
            echo "Server is offline; sending start."
            curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -H "Accept: application/json" \
              -d '{"signal":"start"}' "$base/servers/$SERVER_ID/power" || true
            sleep 10
          fi

          files_json=$(curl -fsS -G -H "$auth" -H "Accept: application/json" \
            --data-urlencode "directory=/" "$base/servers/$SERVER_ID/files/list" || true)
          echo "Root files:"
          printf '%s' "$files_json" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(f["attributes"].get("name"), f["attributes"].get("size"), f["attributes"].get("modified_at")) for f in d.get("data",[]) if f.get("attributes",{}).get("is_file")]' \
            || true

          expected_size=$(wc -c < bot.ts)
          actual_size=$(printf '%s' "$files_json" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((f["attributes"].get("size") for f in d.get("data",[]) if f["attributes"].get("name") == "bot.ts"), ""))' \
            || true)
          echo "bot.ts size: host=$actual_size expected=$expected_size"
          if [ "$actual_size" = "$expected_size" ]; then
            echo "bot.ts matches the pushed version: YES"
          else
            echo "bot.ts matches the pushed version: NO"
          fi
