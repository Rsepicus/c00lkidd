name: Deploy to ACLClouds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: config
        env:
          PANEL_URL: ${{ secrets.PTERO_PANEL_URL }}
          API_KEY: ${{ secrets.PTERO_API_KEY }}
          SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
        run: |
          if [ -z "$PANEL_URL" ] || [ -z "$API_KEY" ] || [ -z "$SERVER_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Pterodactyl secrets are not set; skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build runtime archive
        if: steps.config.outputs.configured == 'true'
        run: |
          files=$(find . -maxdepth 1 -type f \
            \( -name '*.ts' ! -name '*.test.ts' ! -name 'watchdog.ts' \) \
            -printf '%f\n')
          tar -czf deploy.tar.gz $files \
            package.json bun.lock emojis.json emojis-ability.json emojis-skins.json
          tar -tzf deploy.tar.gz

      - name: Upload and restart
        if: steps.config.outputs.configured == 'true'
        uses: rexlmanu/pterodactyl-upload-action@4bae1933575fa712463da38493f5c768232d76ab # v2.5
        with:
          panel-host: ${{ secrets.PTERO_PANEL_URL }}
          api-key: ${{ secrets.PTERO_API_KEY }}
          server-id: ${{ secrets.PTERO_SERVER_ID }}
          source: deploy.tar.gz
          target: "./"
          decompress-target: true
          restart: true

      - name: Verify deployment target
        if: steps.config.outputs.configured == 'true'
        env:
          PANEL_URL: ${{ secrets.PTERO_PANEL_URL }}
          API_KEY: ${{ secrets.PTERO_API_KEY }}
          SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
        run: |
          set -uo pipefail
          base="${PANEL_URL%/}/api/client"
          auth="Authorization: Bearer $API_KEY"

          echo "Servers visible to this API key:"
          curl -fsS -H "$auth" -H "Accept: application/json" "$base" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(s["attributes"].get("identifier"), "|", s["attributes"].get("name"), "|", s["attributes"].get("status")) for s in d.get("data", [])]' \
            || true

          echo "Server state:"
          curl -fsS -H "$auth" -H "Accept: application/json" "$base/servers/$SERVER_ID/resources" \
            | python3 -c 'import json,sys; a=json.load(sys.stdin).get("attributes",{}); r=a.get("resources",{}); print("state:", a.get("current_state"), "| uptime:", r.get("uptime"), "| memory:", r.get("memory_bytes"))' \
            || true

          echo "Root files:"
          curl -fsS -G -H "$auth" -H "Accept: application/json" \
            --data-urlencode "directory=/" "$base/servers/$SERVER_ID/files/list" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(f["attributes"].get("name"), f["attributes"].get("size"), f["attributes"].get("modified_at")) for f in d.get("data",[]) if f.get("attributes",{}).get("is_file")]' \
            || true

          echo -n "bot.ts contains /тест definition: "
          if curl -fsS -G -H "$auth" -H "Accept: application/json" \
            --data-urlencode "file=/bot.ts" "$base/servers/$SERVER_ID/files/content" \
            | grep -q "testCommandEmbed"; then
            echo "YES"
          else
            echo "NO"
          fi
